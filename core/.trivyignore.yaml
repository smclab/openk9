# .trivyignore.yaml — Java/core area Trivy suppressions (Issue #2004)
#
# One file per pipeline area (Java reactor). A suppression here applies to every
# Java module scanned against core/. Structured YAML format: each entry carries
# id + statement (rationale) and, for temporary suppressions, expired_at.
#
# NB on scope: the `trivy fs` jobs use one ignore file per area, but every
# `trivy image` job — backend, frontend, AI and connectors alike — inherits this
# one as its default IGNOREFILE. An entry added here therefore also silences the
# container scans of areas that have their own fs ignore file.
#
# NB on expired_at: Trivy enforces it natively — past the date the entry is
# pruned at parse time and the CVE reappears in the report. A separate CI check
# ALSO fails the pipeline on expired entries, so the re-evaluation is explicit
# even while scans are informational (Phase 1) and for sub-HIGH severities.
# Permanent false positives omit expired_at; mitigations to re-check carry one.
#
# NB on provenance: entries carried over from the OWASP dependency-check era
# were written against filename regexes and never matched anything under Trivy,
# which resolves by Maven coordinate. They were dropped rather than kept as
# decoration. Add an entry here only for a finding this scanner actually reports.
vulnerabilities:
  # --- Temporary suppressions (carry expired_at, re-evaluated before next release) ---

  - id: CVE-2026-45292
    # io.opentelemetry:opentelemetry-api / -extension-trace-propagators (1.55.0 and 1.57.0)
    statement: >-
      Unbounded memory/CPU on oversized W3C baggage headers (DoS). Fixed upstream
      in OpenTelemetry 1.62.0. Quarkus 3.33 LTS resolves 1.55.0 and 1.57.0, and
      the first platform release carrying 1.62.0 is on the 3.39 line, outside this
      LTS: no fix is reachable without pulling OpenTelemetry out of step with the
      platform. Not applicable in practice: baggage propagation headers reach only
      headless/internal services, with no attacker-controlled baggage from the
      public internet. NB severity is contested — GitHub 5.3 MEDIUM vs Red Hat 7.5
      HIGH (availability:H); under the Red Hat score this becomes a blocking
      finding, so re-evaluate as soon as a release on our line ships >= 1.62.0.
    expired_at: 2026-12-22

  - id: CVE-2025-14969
    # org.hibernate.reactive:hibernate-reactive-core 3.2.13.Final
    statement: >-
      Denial of service through database connection pool exhaustion: a remote
      client closing an HTTP connection early leaks the pooled connection behind
      it. This one does apply — datasource and searcher expose exactly that shape
      of endpoint — so it is an accepted risk, not a false positive, and the
      earlier "fixed in Quarkus 3.27.2" wording was wrong. The fix (hibernate-reactive
      commit cd7f104, "Roll back open transactions on close") is contained in tag
      4.2.1 and in no 3.x tag: 3.2.13 and 3.4.2 are diverged from it by 272
      commits. Waiting for the platform does not help either, since Quarkus ships
      3.2.13 on 3.33 and still 3.4.2 on 3.39. Forcing the 4.2.x line under this
      LTS was evaluated — the ORM requirement fits and the pool SPI is unchanged —
      and declined: it would run a Hibernate Reactive major the platform does not
      ship, under the module that already needs a vendored extension. Re-evaluate
      when a Quarkus line ships Hibernate Reactive 4.x.
    expired_at: 2026-12-22

  # --- Permanent suppressions (not applicable, no expiry) ---

  - id: CVE-2026-64607
    # org.apache.httpcomponents.client5:httpclient5 5.4.4
    statement: >-
      Not applicable. The advisory states the connection leak affects the classic
      i/o model only and explicitly excludes the async one. Every path that
      reaches httpclient5 here is async: it enters the tree solely through the
      OpenSearch Apache transport, in datasource and searcher, and opensearch-java
      references org.apache.hc.client5.http.impl.async 18 times and the classic
      package zero times; no OpenK9 source imports org.apache.hc at all. Re-check
      this the day the OpenSearch extension changes transport, since the exclusion
      rests on that choice. Unrelated but worth recording: 5.6.x, the first line
      carrying the fix, turns on transparent gzip inflation that double-decodes
      responses for this transport and stops the datasource from booting.
