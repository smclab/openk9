# .trivyignore.yaml — Trivy suppressions for the Java core reactor
#
# Structured YAML format: each entry carries id + statement (rationale) and,
# for temporary suppressions, expired_at. Trivy enforces expired_at natively:
# past the date the entry is pruned at parse time and the CVE reappears in the
# report. Permanent false positives omit expired_at; mitigations to re-check
# carry one.
#
# NB on scope: on this release line no CI job reads this file yet. It serves
# the SBOM-based vulnerability review of the core reactor (trivy sbom and
# trivy fs with --ignorefile) and is ready for a Trivy CI gate.
#
# Add an entry here only for a finding this scanner actually reports.
vulnerabilities:
  # --- Temporary suppressions (carry expired_at, re-evaluated before next release) ---

  - id: CVE-2025-14969
    # org.hibernate.reactive:hibernate-reactive-core 3.4.4.Final in the services,
    # 3.4.2.Final in the build of the vendored module
    statement: >-
      Denial of service through database connection pool exhaustion: a remote
      client closing an HTTP connection early leaks the pooled connection behind
      it. This one does apply, so it is an accepted risk, not a false positive:
      datasource serves anonymous endpoints backed by Hibernate Reactive (the
      /buckets/current/* resources used by the search frontend), and
      tenant-manager uses it behind the admin role. The fix (hibernate-reactive
      commit cd7f104, "Roll back open transactions on close") is contained in tag
      4.2.1 and in no 3.x tag: Quarkus 3.40 LTS ships 3.4.2, and core/pom.xml
      holds 3.4.4, the newest 3.x patch. Forcing the 4.2.x line under this LTS
      was declined: it would run a Hibernate Reactive major the platform does not
      ship, under the module that already needs a vendored extension.
      Re-evaluate when a Quarkus line ships Hibernate Reactive 4.x.
    expired_at: 2026-12-22

  # --- Permanent suppressions (not applicable, no expiry) ---

  - id: CVE-2026-64607
    # org.apache.httpcomponents.client5:httpclient5 5.4.4
    statement: >-
      Not applicable. The advisory states the connection leak affects the classic
      i/o model only and explicitly excludes the async one. httpclient5 reaches
      only datasource, through the OpenSearch Apache transport (searcher on this
      line uses the high-level REST client, which does not pull it), and
      opensearch-java references org.apache.hc.client5.http.impl.async and never
      the classic package; no OpenK9 source imports org.apache.hc at all.
      Re-check this the day the OpenSearch extension changes transport, since the
      exclusion rests on that choice. Unrelated but worth recording: 5.6.x, the
      first line carrying the fix and the one Quarkus 3.40 manages, turns on
      transparent gzip inflation that double-decodes responses for this
      transport. The datasource then fails its writes to OpenSearch with "Not in
      GZIP format", so core/pom.xml holds 5.4.4.
