# SeaweedFS - simplified configuration for OpenK9
# Chart: https://seaweedfs.github.io/seaweedfs/helm (seaweedfs 4.47.0, needs Helm >= 3.17)

## No ClusterRole: only the master migration of the distributed mode needs
## it, and the install would require cluster-wide permissions
global:
  seaweedfs:
    createClusterRole: false

## All-in-one deployment: master, volume, filer and S3 gateway in one pod
master:
  enabled: false
  ## 64 MB volumes (default 1000): each bucket takes 7, read by all-in-one too
  volumeSizeLimitMB: 64
volume:
  enabled: false
  ## At most 1000 volumes (-volume.max), read by all-in-one; 0 derives it from the free disk
  dataDirs:
  - name: data1
    type: "emptyDir"
    maxVolumes: 1000
filer:
  enabled: false

allInOne:
  enabled: true
  replicas: 1

  ## S3 gateway (port 8333) with authentication
  s3:
    enabled: true
    enableAuth: true

  ## Storage
  data:
    type: persistentVolumeClaim
    size: 10Gi
    accessModes:
    - ReadWriteOnce

  ## Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  ## Security Context
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000

## S3 credentials, from a secret
## The openk9-ingestion and openk9-datasource charts read the same secret
s3:
  credentials:
    admin:
      existingSecret: "s3-secret"
      accessKeyKey: "user"
      secretKeyKey: "password"
