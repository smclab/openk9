apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.name" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
data:
  # Env variables
  ORIGINS: {{ .Values.cors.origins | quote }}
  LOGGING_LEVEL:  {{ .Values.log.level | quote }}

  # Opensearch env variables
  {{- $protocol := .Values.opensearch.protocol | default "http" }}
  {{- if .Values.opensearch.hosts }}
  {{- $hosts := list }}
  {{- range .Values.opensearch.hosts }}
  {{- $hosts = append $hosts (ternary . (printf "%s://%s" $protocol .) (contains "://" .)) }}
  {{- end }}
  OPENSEARCH_HOST: {{ join "," $hosts | quote }}
  {{- else }}
  OPENSEARCH_HOST: "{{ $protocol }}://{{ .Values.opensearch.host }}:{{ .Values.opensearch.port }}"
  {{- end }}
  OPENSEARCH_USERNAME: {{ .Values.opensearch.username | quote }}
  OPENSEARCH_VERIFY_CERTS: {{ .Values.opensearch.verifyCerts | quote }}
  {{- if and .Values.opensearch.caCerts.secretName .Values.opensearch.caCerts.key }}
  OPENSEARCH_CA_CERTS: "/etc/opensearch-certs/{{ .Values.opensearch.caCerts.key }}"
  {{- end }}

  # Grpc env variables
  GRPC_DATASOURCE_HOST: {{ .Values.openk9.datasource.host | quote }}
  GRPC_TENANT_MANAGER_HOST: {{ .Values.openk9.tenantManager.host | quote }}
  GRPC_EMBEDDING_MODULE_HOST: {{ .Values.openk9.embeddingModule.host | quote }}

  # Phoenix arize env variables
  ARIZE_PHOENIX_ENABLED: {{ .Values.phoenix.enabled | quote }}
  ARIZE_PHOENIX_ENDPOINT: {{ .Values.phoenix.endpoint | quote }}
  ARIZE_PHOENIX_PROJECT_NAME: {{ .Values.phoenix.projectName | quote }}

  # Retention env variables
  SCHEDULE: {{ .Values.retention.schedule | quote }}
  CRON_EXPRESSION: {{ .Values.retention.cronexpression | quote }}
  INTERVAL_IN_DAYS: {{ .Values.retention.interval | quote }}

  # Upload documents
  UPLOAD_DIR: {{ .Values.uploadDocuments.uploadDir | quote }}
  UPLOAD_FILE_EXTENSIONS: {{ .Values.uploadDocuments.uploadFileExtensions | quote }}
  MAX_UPLOAD_FILE_SIZE: {{ .Values.uploadDocuments.maxUploadFileSize | quote }}
  MAX_UPLOAD_FILES_NUMBER: {{ .Values.uploadDocuments.maxUploadFilesNumber | quote }}