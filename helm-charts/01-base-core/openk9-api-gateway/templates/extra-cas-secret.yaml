{{- if and .Values.extraCAs.enabled .Values.extraCAs.pem }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.names.name" . }}-extra-cas
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  ca.pem: {{ .Values.extraCAs.pem | quote }}
{{- end }}
