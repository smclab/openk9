services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    hostname: seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./compose-utilities/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    healthcheck:
      test: "curl --silent --fail http://localhost:8333/healthz"
      interval: 10s
      timeout: 5s
      retries: 10
  tika:
    image: ${IMAGE_GROUP:-openk9}/openk9-tika:${IMAGE_TAG:-2026.3.0-SNAPSHOT}
    container_name: openk9-tika
    hostname: openk9-tika
    environment:
      QUARKUS_HTTP_ACCESS_LOG_ENABLED: 'true'
      QUARKUS_HTTP_ACCESS_LOG_PATTERN: '%h %l %u %t "%r" %s %b %D'
      QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE: '10240K'
      QUARKUS_OTEL_SDK_DISABLED: 'true'
      QUARKUS_LOG_CONSOLE_JSON: 'false'
      OPENK9_TIKA_POOL_SIZE: '1'
      QUARKUS_REST_CLIENT_DATASOURCE_URL: 'http://openk9-datasource:8080'
    healthcheck:
      test: "curl --silent --fail http://localhost:8080/q/health"
      interval: 10s
      timeout: 10s
      retries: 10
  minio-connector:
    image: ${IMAGE_GROUP:-openk9}/openk9-minio-connector:${IMAGE_TAG:-2026.3.0-SNAPSHOT}
    container_name: openk9-minio-connector
    hostname: openk9-minio-connector
    ports:
      - "5002:5000"
  docling-processor:
    image: ${IMAGE_GROUP:-openk9}/openk9-docling-processor:${IMAGE_TAG:-2026.3.0-SNAPSHOT}
    container_name: openk9-docling-processor
    hostname: openk9-docling-processor
    environment:
      DATASOURCE_HOST: 'http://openk9-datasource:8080'
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\", timeout=2)'"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Ingestion writes binaries and the datasource pre-signs GET URLs, so both
  # need the object-storage credentials (the file-manager used to hold them).
  ingestion:
    environment:
      QUARKUS_MINIO_HOST: 'http://seaweedfs:8333'
      QUARKUS_MINIO_ACCESS_KEY: 'openk9'
      QUARKUS_MINIO_SECRET_KEY: 'openk9-secret'
      QUARKUS_MINIO_SECURE: 'false'
  datasource:
    environment:
      QUARKUS_MINIO_HOST: 'http://seaweedfs:8333'
      QUARKUS_MINIO_ACCESS_KEY: 'openk9'
      QUARKUS_MINIO_SECRET_KEY: 'openk9-secret'
      QUARKUS_MINIO_SECURE: 'false'

volumes:
  seaweedfs-data:
