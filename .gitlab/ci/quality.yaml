# Trivy FS — JS/frontend dependency scan (Issue #2004, replaces npm-audit analyzer)
# Reads yarn.lock statically — no `yarn install`, so the npm-audit segfault on the
# workspace root (the reason for the old DS_PROJECT_DIR workaround) is gone.
# One job scans the whole js-packages/ tree (root yarn.lock covers admin-ui/
# search-frontend/tenant-ui; talk-to has its own lockfile; chatbot via package.json).
# Moved from the frontend child pipelines to the parent, consistent with Java/Python.
Trivy FS JS:
  extends: .trivy-fs-scan
  variables:
    SCAN_DIR: "js-packages"
    # Single JS ignore file: the frontends share the root yarn.lock, so this one
    # job scans the whole tree and this one file backs it (per-component split is
    # not possible here — see js-packages/.trivyignore header).
    IGNOREFILE: "js-packages/.trivyignore.yaml"
  rules:
    # Block on new branch creation
    - !reference [.rules:antispam-new-branch, rules]
    # 1. Main
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *js_files_list
    # 2. Merge Request → main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *js_files_list
    # 3. Push on release branch N.N.x
    - if: '$CI_COMMIT_BRANCH =~ /^\d+\.\d+\.x$/'
      changes: *js_files_list
