# ================================
# Quality & Security Checks
# ================================

# Define Anchor for Java files list
.java_files_list: &java_files_list
  - core/**/*
  - vendor/**/*
  - pom.xml

# Define Anchor for all-source files list (Java, JS, Python/AI)
# Used by SonarQube so it triggers on any source change, not just Java.
.all_source_files_list: &all_source_files_list
  - core/**/*
  - vendor/**/*
  - js-packages/**/*
  - ai-packages/**/*
  - enrichers/**/*
  - pom.xml
  - "*.json"
  - "*.js"
  - "*.ts"
  - "*.tsx"

# Define Anchor for Python files list
# Issue #2004: connectors/ added — pip-audit never covered them; trivy fs does.
.python_files_list: &python_files_list
  - ai-packages/**/*
  - enrichers/**/*
  - connectors/**/*

# Define Anchor for JS/frontend files list (Issue #2004 — Trivy FS JS dep scan)
.js_files_list: &js_files_list
  - js-packages/**/*

# Trivy FS — Java dependency scan (Issue #2004, replaces OWASP dependency-check)
# trivy fs reads the pom.xml tree statically (no `mvnw install`). Covers both
# core/ (the app reactor) and vendor/ (hibernate-rx multitenancy lib). The actual
# JARs in the image layers are covered separately by the per-module .trivy-image-scan.
# Suppressions live in core/.trivyignore (migrated from dependency-check-suppressions.xml).
# Runs where Java deps can change: main, MR→main, push N.N.x.
# NOT on tags — a tag is only a version bump, deps are identical to main/N.N.x.
# --offline-scan is REQUIRED here: the core/ reactor leaves most versions to the
# remote quarkus-bom (no inline <version>), so without it trivy fetches hundreds
# of poms from Maven Central on an empty .m2 → HTTP 429 + ~30min runner IP ban.
# Cost: BOM-managed transitives needing a remote pom are skipped — the per-module
# image scan covers the real resolved JARs. Do not drop the flag.
Trivy FS Java:
  extends: .trivy-fs-scan
  variables:
    IGNOREFILE: "core/.trivyignore"
  script:
    - for d in core vendor; do
        echo "=== trivy fs (table) $d ===";
        trivy fs --cache-dir "$TRIVY_CACHE_DIR" --ignorefile "$IGNOREFILE"
          --scanners vuln --offline-scan --ignore-unfixed --severity CRITICAL,HIGH,MEDIUM,LOW
          --format table --exit-code 0 "$d";
      done
    - for d in core vendor; do
        trivy fs --cache-dir "$TRIVY_CACHE_DIR" --ignorefile "$IGNOREFILE"
          --scanners vuln --offline-scan --format json --output "trivy-deps-java-$d.json"
          --exit-code 0 "$d";
      done
    # GATE (Phase 2): fail if core/ or vendor/ has a fixable CRITICAL/HIGH
    - RC=0; for d in core vendor; do
        trivy fs --cache-dir "$TRIVY_CACHE_DIR" --ignorefile "$IGNOREFILE"
          --scanners vuln --offline-scan --ignore-unfixed --severity CRITICAL,HIGH
          --exit-code 1 "$d" || RC=1;
      done; exit $RC
  rules:
    # Block first execution when branch is just created
    - !reference [.rules:antispam-new-branch, rules]
    # 1. Main
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *java_files_list
    # 2. Merge Request → main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *java_files_list
    # 3. Push on release branch N.N.x
    - if: '$CI_COMMIT_BRANCH =~ /^\d+\.\d+\.x$/'
      changes: *java_files_list
    # NB: no tag rule (deps identical to main/N.N.x) and no porting-MR rule
    # (porting → N.N.x stays compile-only — see PLAN §5.5 context 6).

# SonarQube Check
SonarQube Check:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
    entrypoint: [ "" ]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache"
    paths:
    - .sonar/cache
  before_script:
  - mkdir /tmp/empty
  script:
  - sonar-scanner -Dsonar.qualitygate.wait=true
  allow_failure: true
  rules:
  # Block first execution when branch is just created
  - !reference [.rules:antispam-new-branch, rules]
  # 1. Main Branch - trigger on any source change
  - if: '$CI_COMMIT_BRANCH == "main"'
    changes: *all_source_files_list
  # 2. Merge Request - trigger on any source change
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *all_source_files_list
  # 3. Tag
  - if: "$CI_COMMIT_TAG"

# Trivy FS — Python dependency scan (Issue #2004, replaces pip-audit)
# Reads every requirements*.txt under ai-packages/, enrichers/ AND connectors/
# statically (no `pip install`). The pyproject.toml stubs hold no pinned deps,
# so trivy ignores them — the real deps live in requirements.txt.
# NEW vs pip-audit: connectors/ is now covered (it never was before).
# The script is overridden (vs the generic single-dir template) to scan exactly
# the three Python trees and nothing else — no overlap with the Java/JS scans.
# Same context set as Trivy FS Java (no tag, no porting-MR).
Trivy FS Python:
  extends: .trivy-fs-scan
  variables:
    IGNOREFILE: "core/.trivyignore"
  # --offline-scan kept for parity with the Java/template scans. It is a no-op
  # for requirements.txt (versions are fully pinned, no remote lookup needed),
  # but keeps all three trivy fs jobs consistent and immune to any future
  # manifest that might trigger a remote resolution.
  script:
    - for d in ai-packages enrichers connectors; do
        echo "=== trivy fs (table) $d ===";
        trivy fs --cache-dir "$TRIVY_CACHE_DIR" --ignorefile "$IGNOREFILE"
          --scanners vuln --offline-scan --ignore-unfixed --severity CRITICAL,HIGH,MEDIUM,LOW
          --format table --exit-code 0 "$d";
      done
    - for d in ai-packages enrichers connectors; do
        trivy fs --cache-dir "$TRIVY_CACHE_DIR" --ignorefile "$IGNOREFILE"
          --scanners vuln --offline-scan --format json --output "trivy-deps-python-$d.json"
          --exit-code 0 "$d";
      done
    # GATE (Phase 2): fail if any of the three trees has a fixable CRITICAL/HIGH
    - RC=0; for d in ai-packages enrichers connectors; do
        trivy fs --cache-dir "$TRIVY_CACHE_DIR" --ignorefile "$IGNOREFILE"
          --scanners vuln --offline-scan --ignore-unfixed --severity CRITICAL,HIGH
          --exit-code 1 "$d" || RC=1;
      done; exit $RC
  rules:
    # Block on new branch creation
    - !reference [.rules:antispam-new-branch, rules]
    # 1. Main
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *python_files_list
    # 2. Merge Request → main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *python_files_list
    # 3. Push on release branch N.N.x
    - if: '$CI_COMMIT_BRANCH =~ /^\d+\.\d+\.x$/'
      changes: *python_files_list

# Trivy FS — JS/frontend dependency scan (Issue #2004, replaces npm-audit analyzer)
# Reads yarn.lock statically — no `yarn install`, so the npm-audit segfault on the
# workspace root (the reason for the old DS_PROJECT_DIR workaround) is gone.
# One job scans the whole js-packages/ tree (root yarn.lock covers admin-ui/
# search-frontend/tenant-ui; talk-to has its own lockfile; chatbot via package.json).
# Moved from the frontend child pipelines to the parent, consistent with Java/Python.
Trivy FS JS:
  extends: .trivy-fs-scan
  variables:
    SCAN_DIR: "js-packages"
    IGNOREFILE: "core/.trivyignore"
  rules:
    # Block on new branch creation
    - !reference [.rules:antispam-new-branch, rules]
    # 1. Main
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *js_files_list
    # 2. Merge Request → main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *js_files_list
    # 3. Push on release branch N.N.x
    - if: '$CI_COMMIT_BRANCH =~ /^\d+\.\d+\.x$/'
      changes: *js_files_list
