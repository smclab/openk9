[project]
name = "agentic-rag-module"
version = "2026.3.0.dev0"
description = "OpenK9 module for agentic Retrieval-Augmented Generation (RAG)"
authors = [{ name = "SMC", email = "smc.roma@smc.it" }]
keywords = ["OpenK9", "Generative AI", "RAG"]
license = "AGPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = [
    "aiofiles==24.1.0",
    "aiohttp==3.14.3",
    "apscheduler==3.11.0",
    "arize-phoenix==13.15.0",
    "arize-phoenix-client==2.1.0",
    "arize-phoenix-evals==2.11.0",
    "arize-phoenix-otel==0.15.0",
    "authlib==1.6.9",
    "cryptography==50.0.0",
    "fastapi==0.137.0",
    "filelock==3.20.1",
    "graphql-core==3.2.7",
    "grpcio-tools==1.78.0",
    "grpcio==1.78.0",
    "h11==0.16.0",
    "ipython==9.11.0",
    "langchain-aws==1.4.0",
    "langchain-classic==1.0.7",
    "langchain-core==1.3.3",
    "langchain-docling==2.0.0",
    "langchain-google-community==3.0.5",
    "langchain-google-genai==4.2.1",
    "langchain-ibm==1.0.4",
    "langchain-ollama==1.0.1",
    "langchain-openai==1.1.11",
    "langchain-text-splitters==1.1.2",
    "langchain==1.2.12",
    "langgraph-checkpoint==2.1.2",
    "langgraph-opensearch==0.1.5",
    "langgraph==1.1.3",
    "langgraph-prebuilt==1.0.8",
    "llama-index-cli==0.5.6",
    "llama-index-core==0.14.18",
    "llama-index==0.14.18",
    "openinference-instrumentation-langchain==0.1.61",
    "opensearch-py==3.1.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-exporter-otlp-proto-common==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation==0.65b0",
    "opentelemetry-proto==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-semantic-conventions==0.65b0",
    "protobuf==6.33.5",
    "pyjwt==2.14.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.30",
    "requests==2.34.2",
    "setuptools==82.0.1",
    "sse-starlette==3.3.3",
    "starlette==1.3.1",
    "uvicorn==0.42.0",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
# CUDA wheels exist for Linux only
gpu = [
    "torch==2.14.1; sys_platform == 'linux'",
    "torchvision==0.29.1; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest==9.1.0"]

[project.urls]
Homepage = "https://www.openk9.io/"
Documentation = "https://www.openk9.io/docs/"
Repository = "https://github.com/smclab/openk9.git"
Issues = "https://github.com/smclab/openk9/issues"

[build-system]
requires = ["hatchling==1.32.4", "grpcio-tools==1.78.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Generates the gRPC stubs on install, see hatch_build.py
[tool.hatch.build.hooks.custom]

[tool.uv]
# The images are Linux; macOS is kept for local development
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# Rebuild the project (and regenerate the stubs) when a .proto changes or a
# stub goes missing
cache-keys = [
    { file = "pyproject.toml" },
    { file = "app/**/*.proto" },
    { file = "app/**/*_pb2*.py" },
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
