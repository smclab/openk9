[project]
name = "embedding_module"
version = "2026.3.0.dev0"
description = "OpenK9 embedding module"
authors = [{ name = "SMC", email = "smc.roma@smc.it" }]
keywords = ["OpenK9", "Generative AI", "embedding", "RAG"]
license = "AGPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = [
    "beautifulsoup4==4.15.0",
    "boto3==1.43.99",
    "chonkie[st, neural, semantic]==1.7.0",
    "grpcio-health-checking==1.71.0",
    "grpcio-reflection==1.71.0",
    "grpcio-tools==1.71.0",
    "grpcio==1.71.0",
    "httpx==0.28.1",
    "ibm-watsonx-ai==1.7.2",
    "langchain_ibm==1.1.0",
    "langchain-aws==1.7.9",
    "langchain-google-vertexai==3.2.4",
    "langchain-huggingface==1.2.2",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.6.3",
    "pydantic-settings==2.15.0",
    "pypdfium2==5.14.0",
    "python-dotenv==1.0.1",
    "pika==1.3.2",
    "pillow==13.0.0",
    "regex==2026.9.3",
    "sentence-transformers==6.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.0"]
# PyTorch variant: cpu is installed by default, gpu replaces it in the
# CUDA images (--no-default-groups --group gpu)
cpu = ["torch==2.14.1"]
# CUDA wheels exist for Linux only
gpu = ["torch==2.14.1; sys_platform == 'linux'"]

[project.urls]
Homepage = "https://www.openk9.io/"
Documentation = "https://www.openk9.io/docs/"
Repository = "https://github.com/smclab/openk9.git"
Issues = "https://github.com/smclab/openk9/issues"

[build-system]
requires = ["hatchling==1.32.4", "grpcio-tools==1.71.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Generates the gRPC stubs on install, see hatch_build.py
[tool.hatch.build.hooks.custom]

[tool.uv]
# Same uv as the Dockerfile, so the lock is written in the same format
required-version = ">=0.13.0"
# The images are Linux; macOS is kept for local development
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]
# Rebuild the project (and regenerate the stubs) when a .proto changes or a
# stub goes missing
cache-keys = [
    { file = "pyproject.toml" },
    { file = "app/**/*.proto" },
    { file = "app/**/*_pb2*.py" },
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-gpu", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
