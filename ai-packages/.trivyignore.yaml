# .trivyignore.yaml — Python AI area Trivy suppressions (Issue #2004)
#
# One file per pipeline area. A suppression here applies to EVERY module in this
# area (scoping is intentionally broad — fewer files to maintain). Keep the
# affected package/module in each statement so it stays traceable.
#
# NB on expired_at: Trivy enforces it natively — past the date the CVE reappears
# in the report; a separate CI check also fails the pipeline to force the
# re-evaluation. Permanent false positives omit it.
#
# Format:
#   vulnerabilities:
#     - id: CVE-YYYY-NNNNN
#       statement: "<why not exploitable / why no fix yet> (<module>)"
#       expired_at: YYYY-MM-DD   # omit for permanent false positives
vulnerabilities:
  - id: GHSA-6v7p-g79w-8964
    statement: "msgpack 1.1.2 vendored inside pip's own bom.cdx.json, not an installed
      package: no PkgPath, and pip 26.2.1 is the latest release on PyPI, so the module
      cannot bump it. Detected on embedding-modules. Review when a newer pip ships."
    expired_at: 2026-12-22
  - id: CVE-2025-47273
    statement: "setuptools 70.3.0 vendored inside pip's own bom.cdx.json, not an installed
      package: no PkgPath, and pip 26.2.1 is the latest release on PyPI, so the module
      cannot bump it. Detected on embedding-modules. Review when a newer pip ships."
    expired_at: 2026-12-22
