services:
  # Creates the keycloak database when it is missing. The postgres init
  # script runs only on an empty volume, so it cannot add it to a volume
  # created without this profile.
  keycloak-db-init:
    image: postgres:17
    container_name: keycloak-db-init
    environment:
      PGHOST: postgresql
      PGUSER: postgres
      PGPASSWORD: openk9
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE keycloak WITH OWNER openk9"
    depends_on:
      postgresql:
        condition: service_healthy
  keycloak:
    image: keycloak/keycloak:26.5
    container_name: keycloak
    command: start-dev
    environment:
      KC_HTTP_PORT: "8081"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql/keycloak
      KC_DB_USERNAME: openk9
      KC_DB_PASSWORD: openk9
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    ports:
      - "8081:8081"
    networks:
      default:
        aliases:
          - keycloak.openk9.localhost
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: "bash -c ':> /dev/tcp/127.0.0.1/8081' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 10
  admin-ui:
    environment:
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://keycloak.openk9.localhost:8081}
  tenant-manager:
    environment:
      KEYCLOAK_URL: 'http://keycloak.openk9.localhost:8081'
      QUARKUS_KEYCLOAK_ADMIN_CLIENT_USERNAME: 'admin'
      QUARKUS_KEYCLOAK_ADMIN_CLIENT_PASSWORD: 'admin'
      OPENK9_TENANT_MANAGER_KEYCLOAK_BASE_ISSUER_URI: 'http://keycloak.openk9.localhost:8081/realms/'
    depends_on:
      keycloak:
        condition: service_healthy
