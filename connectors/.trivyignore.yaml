# .trivyignore.yaml — Connectors area Trivy suppressions (Issue #2004)
#
# One file per pipeline area. A suppression here applies to EVERY module in this
# area (scoping is intentionally broad — fewer files to maintain). Keep the
# affected package/module in each statement so it stays traceable.
#
# NB on expired_at: Trivy enforces it natively — past the date the CVE reappears
# in the report; a separate CI check also fails the pipeline to force the
# re-evaluation. Permanent false positives omit it.
#
# Format:
#   vulnerabilities:
#     - id: CVE-YYYY-NNNNN
#       statement: "<why not exploitable / why no fix yet> (<module>)"
#       expired_at: YYYY-MM-DD   # omit for permanent false positives
vulnerabilities:
  - id: GHSA-6v7p-g79w-8964
    # msgpack 1.1.2 — database-connector, email-connector, gitlab-connector,
    # minio-connector, openk9-crawler, rest-api-connector, youtube-connector
    statement: >-
      False positive: the flagged version comes from pip's own internal
      vendor.txt manifest (site-packages/pip/_vendor/vendor.txt), which just
      records what pip vendors for its own bundled/internal use. Not an
      installed application package, not reachable via connector code or any
      untrusted external input. Verified in the built images: the
      application-facing msgpack resolves to a current, non-vulnerable version
      via normal pip install. Re-evaluate if pip bumps its vendored copy, or if
      a future finding shows a real installed-package occurrence (not
      pip/_vendor).
  - id: CVE-2025-47273
    # setuptools 70.3.0 — same connectors and same pip/_vendor cause as
    # GHSA-6v7p-g79w-8964
    statement: >-
      False positive: same pip/_vendor.txt cause as GHSA-6v7p-g79w-8964 above
      (not an installed application package, not reachable via connector code
      or untrusted input). Re-evaluate under the same conditions.
